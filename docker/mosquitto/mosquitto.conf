# Mosquitto do SensorHub (imagem com o plugin mosquitto-go-auth).
# O broker NÃO guarda credenciais: pergunta ao bridge (backend HTTP) a cada conexão e a cada publicação. Assim a MESMA chave de API
# (criada, rotacionada e desativada pela API de administração) vale para HTTP e MQTT, sem um arquivo de senhas para manter em paralelo.

listener 1883
allow_anonymous false

# Sessões persistentes: mensagens QoS 1 destinadas a um assinante offline ficam guardadas em vez de se perderem.
persistence true
persistence_location /var/lib/mosquitto/
autosave_interval 30

# Limites contra um dispositivo (ou um bug) que inunde o broker.
message_size_limit 262144
max_inflight_messages 200
max_queued_messages 200000
max_connections 10000

auth_plugin /mosquitto/go-auth.so
auth_opt_backends http
auth_opt_log_level warn

auth_opt_http_host mqtt-bridge
auth_opt_http_port 8080
auth_opt_http_method POST
auth_opt_http_params_mode json
auth_opt_http_response_mode status
auth_opt_http_getuser_uri /mqtt/auth
auth_opt_http_superuser_uri /mqtt/superuser
auth_opt_http_aclcheck_uri /mqtt/acl

# Cache curto: a ACL é consultada a cada publicação e o Postgres não deve sentir 20 mil msg/s. É também o atraso máximo para
# "desativar o dispositivo" cortar quem já está conectado.
auth_opt_cache true
auth_opt_cache_type go-cache
auth_opt_cache_reset true
auth_opt_auth_cache_seconds 30
auth_opt_acl_cache_seconds 30
