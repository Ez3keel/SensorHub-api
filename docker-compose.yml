# Infraestrutura local do SensorHub. Cada fase adiciona seus serviços aqui.
#   docker compose up -d                          só a infraestrutura (API/Worker rodam no host com dotnet run)
#   docker compose --profile apps up -d --build   TUDO: API, 2 Workers, dashboard (http://localhost:8081)
#   docker compose --profile tools run --rm register   cadastra a frota e imprime a chave do gateway (uma vez)
#   docker compose --profile tools run --rm load       gera carga com a chave em SENSORHUB_DEVICE_KEY
#   docker compose down -v                        derruba e apaga volumes
# Segredos vêm do ambiente/.env (veja .env.example); a API recusa subir em Production sem SENSORHUB_JWT_KEY.
name: sensorhub

# Ambiente comum aos hosts .NET dentro da rede do Compose (hostnames dos serviços, não localhost).
x-app-env: &app-env
  ASPNETCORE_ENVIRONMENT: Production
  ConnectionStrings__Postgres: Host=timescaledb;Port=5432;Database=sensorhub;Username=sensorhub;Password=sensorhub;Maximum Pool Size=20
  Redis__ConnectionString: redis:6379,abortConnect=false
  Kafka__BootstrapServers: kafka:9092
  Observability__OtlpEndpoint: http://jaeger:4317

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: sensorhub-kafka
    ports:
      - "29092:29092"   # listener EXTERNAL: acessível do host (dotnet run, simulador)
    environment:
      # KRaft: o próprio broker é o controller (sem ZooKeeper).
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Dois listeners de cliente: INTERNAL para containers (kafka:9092) e EXTERNAL para o host (localhost:29092).
      # O broker devolve o endereço ANUNCIADO nos metadados; se ele não for alcançável pelo cliente, a conexão falha.
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Um único broker: fatores de replicação dos tópicos internos = 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Tópicos são criados explicitamente pela aplicação (partições certas); auto-create usaria 1 partição.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: sensorhub-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8092:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: sensorhub
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  timescaledb:
    # PostgreSQL 16 com a extensão TimescaleDB instalada. Na Fase 2 usamos uma tabela Postgres comum;
    # a Fase 3 a converte em hypertable (e compara com o Postgres puro).
    image: timescale/timescaledb:latest-pg16
    container_name: sensorhub-db
    ports:
      - "5433:5432"     # 5433 no host: evita colisão com outros Postgres da máquina
    environment:
      POSTGRES_USER: sensorhub
      POSTGRES_PASSWORD: sensorhub
      POSTGRES_DB: sensorhub
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sensorhub -d sensorhub"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - db-data:/var/lib/postgresql/data

  redis:
    # Estado quente: último valor por sensor (e, na Fase 5, estado das regras de alerta). AOF a cada segundo:
    # o dado é derivado (reconstruível pelo Kafka), mas persistir evita reconstruir a cada restart.
    image: redis:7-alpine
    container_name: sensorhub-redis
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6380:6379"     # 6380 no host: evita colisão com outros Redis da máquina
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data

  # ---------------------------------------------------------------- observabilidade (Fase 7)
  prometheus:
    image: prom/prometheus:latest
    container_name: sensorhub-prometheus
    ports:
      - "9091:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # alcança API/Worker rodando no host (dotnet run)
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  kafka-exporter:
    # Lag por consumer group medido pelo BROKER. Complementa o gauge interno: se todos os consumers de um grupo morrem, o
    # gauge deles some, mas este continua mostrando o lag crescendo, que é exatamente quando ele mais importa.
    image: danielqsj/kafka-exporter:latest
    container_name: sensorhub-kafka-exporter
    command: ["--kafka.server=kafka:9092"]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9308:9308"

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: sensorhub-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # UI de traces
      - "14317:4317"    # OTLP gRPC (14317 no host: evita colisão com outros coletores da máquina)

  grafana:
    image: grafana/grafana:latest
    container_name: sensorhub-grafana
    depends_on:
      - prometheus
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"        # ambiente local: sem login
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/sensorhub.json
    ports:
      - "3001:3000"
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

  # ---------------------------------------------------------------- aplicação (Fase 9, perfil "apps")
  api:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: docker/dotnet.Dockerfile
      args: { PROJECT: src/SensorHub.Api, ENTRY: SensorHub.Api.dll }
    image: sensorhub-api:local
    restart: unless-stopped
    depends_on:
      kafka: { condition: service_healthy }
      timescaledb: { condition: service_healthy }
      redis: { condition: service_healthy }
    # A API NÃO publica porta: só o nginx do dashboard a alcança. Por isso é seguro confiar no X-Forwarded-For dele.
    expose: ["8080"]
    environment:
      <<: *app-env
      Security__JwtSigningKey: ${SENSORHUB_JWT_KEY:-}
      Security__BootstrapAdmin__Email: ${SENSORHUB_ADMIN_EMAIL:-}
      Security__BootstrapAdmin__Password: ${SENSORHUB_ADMIN_PASSWORD:-}
      Security__TrustForwardedHeaders: "true"
      Security__RateLimits__IngestionPerSecond: ${SENSORHUB_INGEST_RATE:-2000}
      Security__RateLimits__IngestionBurst: ${SENSORHUB_INGEST_BURST:-4000}
    healthcheck:
      # a imagem do runtime não tem curl/wget: um GET cru via /dev/tcp do bash
      test:
        - CMD
        - bash   # /dev/tcp é recurso do bash; o CMD-SHELL usaria o sh (dash), que não o tem
        - -c
        # bloco literal ("|"): as barras invertidas do printf chegam ao shell sem serem reinterpretadas pelo YAML
        - |
          exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/live HTTP/1.0\r\n\r\n' >&3 && head -1 <&3 | grep -q 200
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: docker/dotnet.Dockerfile
      args: { PROJECT: src/SensorHub.Worker, ENTRY: SensorHub.Worker.dll }
    image: sensorhub-worker:local
    restart: unless-stopped
    # Escalável: cada réplica entra nos consumer groups e o Kafka reparte as partições entre elas (demonstração de rebalance).
    deploy:
      replicas: 2
    depends_on:
      api: { condition: service_healthy }   # a API aplica as migrações; o Worker sobe depois
    environment:
      <<: *app-env
      ASPNETCORE_URLS: http://+:9464

  dashboard:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: docker/dashboard/Dockerfile
    image: sensorhub-dashboard:local
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "8081:80"

  # ---------------------------------------------------------------- ferramentas (perfil "tools")
  register:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: docker/dotnet.Dockerfile
      args: { PROJECT: tools/SensorHub.Simulator, ENTRY: SensorHub.Simulator.dll }
    image: sensorhub-simulator:local
    depends_on:
      api: { condition: service_healthy }
    environment:
      SENSORHUB_ADMIN_PASSWORD: ${SENSORHUB_ADMIN_PASSWORD:-}
    command: ["--mode", "register", "--url", "http://api:8080", "--sensors", "${SENSORS:-300}", "--rules", "threshold,nodata",
              "--admin-email", "${SENSORHUB_ADMIN_EMAIL:-}"]

  load:
    profiles: ["tools"]
    image: sensorhub-simulator:local
    depends_on:
      api: { condition: service_healthy }
    command: ["--mode", "http", "--url", "http://api:8080", "--sensors", "${SENSORS:-300}", "--rate", "${RATE:-3000}",
              "--duration", "${DURATION:-60}", "--batch", "${BATCH:-100}", "--workers", "${WORKERS:-4}", "--hot", "${HOT:-1}",
              "--api-key", "${SENSORHUB_DEVICE_KEY:-}"]

volumes:
  kafka-data:
  redis-data:
  prometheus-data:
  grafana-data:
  db-data:
